version: "3.9"

services:

  # ── Redis — short-term working memory ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agentops_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── ChromaDB — long-term semantic memory ───────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: agentops_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AgentOps API ───────────────────────────────────────────────────────────
  api:
    build: .
    container_name: agentops_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - ./workspace:/app/workspace
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  # ── Streamlit Review UI ───────────────────────────────────────────────────
  review_ui:
    build: .
    container_name: agentops_review_ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - AGENTOPS_API_URL=http://api:8080
    depends_on:
      - api
    command: streamlit run review_ui/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  redis_data:
  chroma_data:
