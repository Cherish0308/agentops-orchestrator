version: "3.9"

services:

  # ── Redis — Celery broker + short-term working memory ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: agentops_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PostgreSQL — task audit log ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: agentops_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops
      POSTGRES_DB: agentops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── ChromaDB — long-term semantic memory ───────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: agentops_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AgentOps API ───────────────────────────────────────────────────────────
  api:
    build: .
    container_name: agentops_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql://agentops:agentops@postgres:5432/agentops
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - ./workspace:/app/workspace
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  # ── Celery Worker — async task execution ───────────────────────────────────
  worker:
    build: .
    container_name: agentops_worker
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql://agentops:agentops@postgres:5432/agentops
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - ./workspace:/app/workspace
    command: celery -A app.celery_app.celery worker --loglevel=info --concurrency=2

  # ── Streamlit Review UI ────────────────────────────────────────────────────
  review_ui:
    build: .
    container_name: agentops_review_ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - AGENTOPS_API_URL=http://api:8080
    depends_on:
      - api
    command: streamlit run review_ui/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  redis_data:
  postgres_data:
  chroma_data:
